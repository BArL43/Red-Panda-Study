name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Go API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$files"
            echo "Formatting diff:"
            gofmt -d .
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...

  containers:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare CI environment
        run: |
          cat > deploy/.env <<EOF
          APP_DOMAIN=localhost
          VIBE_API_KEY=
          VIBE_MODEL=gpt-5.6-sol
          ADMIN_EMAIL=admin@example.com
          ADMIN_PASSWORD=ci-admin-password-1234
          APP_GIT_COMMIT=$GITHUB_SHA
          EOF
      - name: Validate compose
        run: docker compose -f deploy/compose.yml config >/dev/null
      - name: Build images
        run: |
          docker build --tag red-panda-study-web:ci .
          docker build --tag red-panda-study-api:ci ./backend
      - name: Start API and web
        run: docker compose -f deploy/compose.yml up -d --build api web
      - name: Wait for services
        run: |
          for attempt in $(seq 1 30); do
            if docker compose -f deploy/compose.yml exec -T api wget -qO- http://127.0.0.1:8788/api/health >/dev/null 2>&1 \
              && docker compose -f deploy/compose.yml exec -T web node -e "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose.yml ps
          docker compose -f deploy/compose.yml logs api web
          exit 1
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/compose.yml down -v
