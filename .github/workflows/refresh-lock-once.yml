name: Refresh lockfile once

on:
  push:
    branches:
      - chore/remove-unused-d1-starter

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-unused-d1-starter
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize lockfile and remove this workflow
        run: |
          npm install --package-lock-only --ignore-scripts
          rm .github/workflows/refresh-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-lock-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh lockfile after Drizzle removal"
          git push
