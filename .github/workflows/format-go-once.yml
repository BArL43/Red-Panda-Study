name: Format Go once

on:
  push:
    branches:
      - portfolio-public-prep

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-public-prep
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"
      - name: Apply gofmt and remove temporary workflow
        run: |
          gofmt -w backend/internal/app/server.go \
            backend/internal/app/server_test.go \
            backend/internal/app/store_chat.go \
            backend/internal/app/types.go
          git rm .github/workflows/format-go-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/app/server.go \
            backend/internal/app/server_test.go \
            backend/internal/app/store_chat.go \
            backend/internal/app/types.go
          git commit -m "style: apply gofmt to backend"
          git push origin HEAD:portfolio-public-prep
