services:
  - type: web
    name: red-panda-study-web
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: GO_API_HOSTPORT
        fromService:
          type: web
          name: red-panda-study-api
          property: hostport
      - key: VIBE_API_KEY
        sync: false
      - key: VIBE_MODEL
        value: gpt-5.6-sol

  - type: web
    name: red-panda-study-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: red-panda-study-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_PATH
        value: /data/redpanda.db
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_APP_URL
        value: https://red-panda-study-web.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://red-panda-study-web.onrender.com
      - key: SECURE_COOKIES
        value: "true"
      - key: CROSS_SITE_COOKIES
        value: "false"
